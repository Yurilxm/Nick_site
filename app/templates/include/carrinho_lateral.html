{% load static %}

<div class="carrinho-container" id="carrinho">
  <div class="carrinho-conteudo">

    <!-- HEADER DO CARRINHO -->
    <div class="carrinho-header">
      <h2>Seu carrinho</h2>
      <button class="btn-fechar-carrinho" id="fechar-carrinho">×</button>
    </div>

    <!-- LISTA DE ITENS - SEMPRE VAZIA NO HTML INICIAL -->
    <ul id="mini-carrinho-lista">
      <p>Seu carrinho está vazio.</p>
    </ul>

    <!-- RODAPÉ - INICIALMENTE OCULTO -->
    <div class="btn-finais" style="display: none;">
      <hr>
      <div class="mini-total-linha">
        <span>Total:</span>
        <span>R$ <span id="mini-carrinho-total">0,00</span></span>
      </div>
      <a href="{% url 'carrinho:ver_carrinho' %}" class="btn-mini">Ver carrinho</a>
      <a href="{% url 'carrinho:finalizar_compra' %}" class="btn-mini">Finalizar compra</a>
    </div>

  </div>
</div>
