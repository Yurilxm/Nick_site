{% load static %}

<div class="produto-card" {% if produto.tem_hover %}tem-hover{% endif %}>
  <div class="produto-imagem">

    <!-- imagem principal -->
    <img class="img-principal" src="{{ produto.imagem.url }}" alt="{{ produto.nome }}">

    {% with produto.imagens_hover|first as img_hover %}
      {% if img_hover %}
        <img class="img-hover" src="{{ img_hover.imagem.url }}" alt="{{ produto.nome }} hover">
      {% endif %}
    {% endwith %}

  </div>

  <div class="produto-info">
    <h3 class="card-nome">{{ produto.nome }}</h3>
    <p class="card-preco">R$ {{ produto.preco }}</p>

    <a href="{% url 'detalhe_produto' produto.id produto.slug %}" class="card-botao">
      Ver produto
    </a>
  </div>
</div>
