{% load static %}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

<div class="topbar">
    <div class="topbar-linha1">
        <div class="avatar">
            <img src="{% static 'imagens/Nick_sem_fundo.png' %}" alt="Avatar">
        </div>

        <div class="navbar">
            <i class="bi bi-search"></i>
            <input type="text" placeholder="Buscar produtos...">
        </div>

        <div class="icones">
            {% if user.is_authenticated %}
                <form action="{% url 'logout' %}" method="post">
                    {% csrf_token %}
                    <button type="submit" class="icon-btn">
                    <i class="bi bi-box-arrow-right"></i>
                    </button>
                </form>
            {% else %}
                <a href="{% url 'login' %}">
                    <i class="bi bi-person-fill"></i>
                </a>
            {% endif %}

            <a href="#" id="btn-carrinho" class="icone-carrinho">
                <i class="bi bi-cart-fill"></i>
                <span id="badge-carrinho" class="badge-carrinho">0</span>
            </a>
            
        </div>
    </div>
        
    <div class="topbar-linha2">
        <div class="links">
            <div class="menu">
                <a href="{% url 'home' %}">Início</a>
                <a href="{% url 'lista_produtos' %}">Produtos</a>
                <a href="{% url 'produtos_por_categoria' 'agendas' %}">Agendas</a>
                <a href="{% url 'produtos_por_categoria' 'canecas' %}">Canecas</a>
                <a href="{% url 'produtos_por_categoria' 'cadernetas' %}">Cadernetas de vacinação</a>
                <a href="{% url 'sobre' %}">Sobre</a>
                <a href="{% url 'contato' %}">Contato</a>
            </div>
        </div>
    </div>      
</div>
