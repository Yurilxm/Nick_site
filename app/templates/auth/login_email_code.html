{% extends "base.html" %}
{% load static %}

{% block title %}Entrar com código | Nick Brindes{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-container single">

    <div class="auth-form">
      <h1>Entrar com código</h1>
      <p>Informe seu e-mail para receber o código de acesso.</p>

      <form method="post" action="{% url 'login_code_send' %}">
        {% csrf_token %}

        <input type="email" name="email" placeholder="Seu e-mail" required>

        <button type="submit">
          Enviar código
        </button>
      </form>

      <div class="auth-links-extra">
        <a href="{% url 'login' %}">Voltar para o login</a>
      </div>
    </div>

  </div>
</div>
{% endblock %}
