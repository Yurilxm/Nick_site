{% extends "base.html" %}

{% block title %}Nova senha | Nick Brindes{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-container single">

    <div class="auth-form">
      <form method="post">
        {% csrf_token %}

        <h1>Nova senha</h1>

        {{ form.new_password1 }}
        {{ form.new_password2 }}

        <button type="submit">Redefinir senha</button>
      </form>
    </div>

  </div>
</div>
{% endblock %}
