{% load static %}

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel - Mimos da Nick Personalizados</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon/fonts/remixicon.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Pacifico&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'admin/css/login.css' %}">
</head>
<body>

    <!-- Floating bubbles -->
    <div class="bubbles">
        <div class="bubble"></div><div class="bubble"></div><div class="bubble"></div>
        <div class="bubble"></div><div class="bubble"></div><div class="bubble"></div>
        <div class="bubble"></div><div class="bubble"></div><div class="bubble"></div>
        <div class="bubble"></div><div class="bubble"></div><div class="bubble"></div>
    </div>

    <!-- Floating hearts -->
    <div class="hearts">
        <div class="heart">🩷</div>
        <div class="heart">💜</div>
        <div class="heart">💙</div>
        <div class="heart">🩷</div>
        <div class="heart">💜</div>
    </div>

    <div class="login-container">

        <!-- Decorative sparkles -->
        <div class="sparkle">✨</div>
        <div class="sparkle">⭐</div>
        <div class="sparkle">✨</div>

        <!-- Top ribbon dots -->
        <div class="ribbon">
            <div class="ribbon-dot"></div>
            <div class="ribbon-dot"></div>
            <div class="ribbon-dot"></div>
            <div class="ribbon-dot"></div>
            <div class="ribbon-dot"></div>
        </div>

        <!-- Brand -->
        <div class="brand">
            <span class="brand-icon">🎀</span>
            <h1>Mimos da Nick</h1>
            <p>✦ Painel Administrativo ✦</p>
        </div>

        <form method="post">

            {% csrf_token %}

            <div class="field-group">
                <label><span>🧸</span> Usuário</label>
                {{ form.username }}
            </div>

            <div class="field-group">
                <label><span>🔑</span> Senha</label>
                <div class="password-wrapper">
                    {{ form.password }}
                    <i class="ri-eye-off-fill" id="togglePassword"></i>
                </div>
            </div>

            <button type="submit" class="btn-login">
                🌸 Entrar
            </button>

        </form>

    </div>

    <script src="{% static 'admin/js/login.js' %}"></script>

</body>
</html>
